[[program]]
name = "fasta"
tier = 1
about = "fasta N=1000: LCG with long, float compare, malloc, strings (z88dk; Benchmarks Game, BSD-3-Clause). Float: uc80/sdcc IEEE single, z88dk genmath 48-bit"
files = [{ repo = "z88dk", path = "support/benchmarks/fasta/fasta.c", sha256 = "284a694064e69a99a6c0bcbc15bd7368fa9cb1dcfb8fa08b06487ed76ae82160", main = true }]
check_defines = ["PRINTF"]
time_defines = ["TIMER"]
variants = [{ name = "static", defines = ["STATIC"] }]
# The check output is the 171-line FASTA text; the golden file equals
# upstream fasta/fasta-output.txt.  The check build prints inside the
# timed region (upstream design); the time build prints nothing.
# One edit: z88dk classic needs a heap for malloc.  The upstream z88dk
# readme passes -pragma-define:CRT_HEAP_AMALLOC=1; the edit puts the same
# "#pragma output" in the source's own "#ifdef __Z88DK" block, so the
# other compilers see no change.
# Second edit: the alu string uses backslash-newline line splices between
# adjacent string literals.  HI-TECH C 3.09's preprocessor does not splice
# lines outside directives ("illegal character (0134)").  Without the
# backslashes the literals still concatenate to the same string, so the
# program is unchanged for every compiler.
edit = [
  { file = "fasta.c", old = "   #include <intrinsic.h>", new = '''   #include <intrinsic.h>
   // bench: z88dk classic malloc needs a heap (upstream readme switch)
   #pragma output CRT_HEAP_AMALLOC = 1''' },
  { file = "fasta.c", old = '''   "GGCCGGGCGCGGTGGCTCACGCCTGTAATCCCAGCACTTTGG" \
   "GAGGCCGAGGCGGGCGGATCACCTGAGGTCAGGAGTTCGAGA" \
   "CCAGCCTGGCCAACATGGTGAAACCCCGTCTCTACTAAAAAT" \
   "ACAAAAATTAGCCGGGCGTGGTGGCGCGCGCCTGTAATCCCA" \
   "GCTACTCGGGAGGCTGAGGCAGGAGAATCGCTTGAACCCGGG" \
   "AGGCGGAGGTTGCAGTGAGCCGAGATCGCGCCACTGCACTCC" \
''', new = '''   "GGCCGGGCGCGGTGGCTCACGCCTGTAATCCCAGCACTTTGG"
   "GAGGCCGAGGCGGGCGGATCACCTGAGGTCAGGAGTTCGAGA"
   "CCAGCCTGGCCAACATGGTGAAACCCCGTCTCTACTAAAAAT"
   "ACAAAAATTAGCCGGGCGTGGTGGCGCGCGCCTGTAATCCCA"
   "GCTACTCGGGAGGCTGAGGCAGGAGAATCGCTTGAACCCGGG"
   "AGGCGGAGGTTGCAGTGAGCCGAGATCGCGCCACTGCACTCC"
''' },
]

