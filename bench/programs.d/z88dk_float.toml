    0xff, 0xff, 0xff, 0x00, 0x00, 0x00, 0x00, 0x0f, 0xff, 0xff, 0xe7, 0x00,
    0x00, 0x00, 0x00, 0x06, 0x3f, 0xff, 0xc0, 0x00, 0x00, 0x00, 0x00, 0x00,
    0x2f, 0xfd, 0x40, 0x00, 0x00, 0x00, 0x00, 0x00, 0x08, 0xf1, 0x40, 0x00,
    0x00, 0x00, 0x00, 0x00, 0x01, 0xf0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
    0x01, 0xf8, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x03, 0xf8, 0x00, 0x00,
    0x00, 0x00, 0x00, 0x00, 0x03, 0xf8, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
    0x00, 0xe0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x60, 0x00, 0x00,
    0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
    0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00
};

static void bench_check(int w, int h)
{
    int i, b, r, c, n = 0;
    unsigned char x;
    unsigned char *p = bench_out;
    for (i = 0; i < 480; i++) {
        x = bench_out[i] ^ bench_ref[i];
        for (b = 0; b < 8; b++) { n += x & 1; x >>= 1; }
    }
    if (n <= BENCH_TOLERANCE) {
        printf("bitmap matches the reference within %d pixels\n",
               BENCH_TOLERANCE);
        return;
    }
    printf("bitmap differs from the reference in %d pixels\n", n);
    for (r = 0; r < h; r++) {
        for (c = 0; c < w; c++)
            putchar((p[c >> 3] & (0x80 >> (c & 7))) ? '#' : '.');
        putchar('\n');
        p += (w + 7) >> 3;
    }
}
#endif''' },
  { file = "mandelbrot.c", old = "TIMER_STOP();", new = '''TIMER_STOP();

#ifdef PRINTF
    bench_check(w, h);
#endif
    return 0;''' },
]

[[program]]
name = "n-body"
tier = 1
about = "n-body, 5 planets, 1000 steps, float + - * / sqrt (z88dk; Benchmarks Game, BSD-3-Clause). Float: uc80/sdcc IEEE single, z88dk genmath 48-bit"
files = [{ repo = "z88dk", path = "support/benchmarks/n-body/n-body.c", sha256 = "36c16383db72f4ed7fd217646de92b5a40b2c96737e42bc6bccbed313604a3a6", main = true }]
check_defines = ["PRINTF"]
time_defines = ["TIMER"]
variants = [{ name = "static", defines = ["STATIC"] }]
# Upstream prints the energy before and after with %.9f (double:
# -0.169075164 and -0.169087605).  With 4-byte floats the error of 1000
# steps grows: SDCC gives -0.1691296, z88dk-zsdcc -0.1691582.  So
# bench_print rounds to 3 decimals (-0.169 for both lines); 4 decimals
# would fail z88dk-zsdcc.  The energy is still computed and printed
# inside the timed region of the check build only; the time build has no
# energy() call, as upstream.
edit = [
  { file = "n-body.c", old = "   #define PRINTF2(a,b)      printf(a,b)", new = "   #define PRINTF2(a,b)      bench_print(b)" },
  { file = "n-body.c", old = "#define pi 3.141592653589793", new = '''
#ifdef PRINTF
/* bench: print v rounded to BENCH_DECIMALS decimals with putchar only.
   %f and %e output differ between C libraries, and the upstream
   CLIB_OPT_PRINTF pragmas limit z88dk printf to the upstream formats.
   Digits come from compare and subtract, not long / and %, which
   z88dk-sccz80 -O3 gets wrong in a digit loop.  The n-- step
   undoes a float to long conversion that rounds instead of
   truncating (HI-TECH C 3.09); it does nothing elsewhere. */
#ifndef BENCH_DECIMALS
#define BENCH_DECIMALS 3
#endif
static const long bench_p10[9] = { 100000000L, 10000000L, 1000000L,
    100000L, 10000L, 1000L, 100L, 10L, 1L };
static void bench_print(double v)
{
    double scale = 1.0;
    long n;
    int d, i, started = 0;
    for (d = 0; d < BENCH_DECIMALS; d++) scale *= 10.0;
    if (v < 0) { putchar('-'); v = -v; }
    v = v * scale + 0.5;
    n = (long)v;
    if ((double)n > v) n--;  /* HI-TECH C 3.09 rounds here */
    for (i = 0; i < 9; i++) {
        d = 0;
        while (n >= bench_p10[i]) { n -= bench_p10[i]; d++; }
        if (i == 8 - BENCH_DECIMALS) {
            putchar('0' + d);
            putchar('.');
            started = 1;
        } else if (d || started) {
            putchar('0' + d);
            started = 1;
        }
    }
    putchar('\n');
}
#endif


#if defined(__SDCC) && !defined(__Z88DK)
/* bench: SDCC's math.h declares only sqrtf; SDCC double is float, so
   sqrtf is the function sqrt would be (z88dk-zsdcc has sqrt) */
#define sqrt sqrtf
#endif

#define pi 3.141592653589793''' },
]

