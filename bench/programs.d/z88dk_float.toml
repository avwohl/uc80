# Float benchmarks from z88dk support/benchmarks (repo z88dk, pinned in
# programs.toml).  The upstream files are fetched, not vendored.
#
# Float libraries (the rows compare these more than code generators):
#   uc80          double = 4-byte IEEE single, uc80 libc (lib/lc) soft float
#   sdcc          double = 4-byte IEEE single, SDCC z80.lib soft float (C)
#   z88dk-sccz80  double = 6-byte genmath (math48), classic +cpm -lm
#   z88dk-zsdcc   double = 4-byte IEEE in the ABI, computed by math48
#                 (classic +cpm -lmath48)
# The z88dk rows need the math library on the link line; see the harness
# request that adds -lm / -lmath48 to the z88dk adapter.
#
# Fair check (edits applied to every compiler):
#   * %f and %e output differs between C libraries (SDCC's stock printf
#     has no float conversions at all; z88dk classic prints "3.1416e0"
#     where the host prints "3.1416e+00").  The check builds therefore
#     print each float result with bench_print(), which rounds to a fixed
#     number of decimals and prints it with integer printf and putchar
#     only.  The number of decimals is chosen so that every 32-bit float
#     library must get it right (see each program's comment).
#   * The time builds keep the upstream code: no printing in the timed
#     region, same problem sizes.

[[program]]
name = "mandelbrot"
tier = 1
about = "Mandelbrot 60x60, 50 iterations, float + - * (z88dk; Benchmarks Game, BSD-3-Clause). Float: uc80/sdcc IEEE single, z88dk genmath 48-bit"
files = [{ repo = "z88dk", path = "support/benchmarks/mandelbrot/mandelbrot.c", sha256 = "337edeed6ea7d1707a320f26b556298640e36357b18a59934180b712d671e359", main = true }]
check_defines = ["PRINTF"]
time_defines = ["TIMER"]
variants = [{ name = "static", defines = ["STATIC"] }]
# 1. Upstream leaves bit_num and byte_acc uninitialized when STATIC is
#    not defined (the Benchmarks Game original sets both to 0).  The
#    edit sets both to 0 before the timed region (2 bad pixels on sdcc
#    and sccz80 without it).  z88dk-zsdcc (math48) still writes an
#    empty bitmap without STATIC even with the fix; +static passes.
#    That is a zsdcc problem, not a source problem.
# 2. Upstream writes the bitmap to absolute address 0xc000 (or putc()s raw
#    P4 bytes with PRINTF).  Both builds now write into a static buffer
#    with the same "*output++ = a" store, so the timed loop is unchanged
#    and nothing depends on the memory map.
# 3. After TIMER_STOP the check build compares the bitmap with a reference
#    bitmap (from the host build; IEEE double and IEEE single give the
#    same 3600 pixels) and prints one line.  Pixels on the set boundary
#    depend on float rounding, so up to 2 pixels may differ.  Measured:
#    SDCC (truncating add) and z88dk-sccz80 genmath differ in 0 pixels.
#    Outside the tolerance the program also prints the count and the
#    bitmap as text.
edit = [
  { file = "mandelbrot.c", old = "   #define PUTC(a,b)         putc(a,b)", new = "   #define PUTC(a,b)         (*output++ = a)" },
  { file = "mandelbrot.c", old = '    PRINTF3("P4\n%d %d\n",w,h);', new = '''    bit_num = 0;      /* bench: uninitialized upstream */
    byte_acc = 0;
    PRINTF3("P4\n%d %d\n",w,h);''' },
  { file = "mandelbrot.c", old = "unsigned char *output = (unsigned char *)0xc000;", new = '''
/* bench: static buffer instead of absolute address 0xc000 */
unsigned char bench_out[480];
unsigned char *output = bench_out;

#ifdef PRINTF
/* bench: the 60x60 bitmap of a host build.  Boundary pixels depend on
   float rounding, so up to BENCH_TOLERANCE pixels may differ. */
#define BENCH_TOLERANCE 2
static const unsigned char bench_ref[480] = {
    0x00, 0x00, 0x00, 0x00, 0x00, 0x04, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
    0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
