# ---------------------------------------------------------- Decompressors

[[program]]
name = "zx0"
tier = 2
about = "ZX0 v2 decompressor (dzx0.c, BSD-3-Clause; glue GPL-3.0-or-later), 4507-byte blob to 8000 bytes"
files = [
  { repo = "zx0", path = "src/dzx0.c", sha256 = "9785525e56a77c63ffe8a1e179f63680cd82e0fa60be5d6f57ce15e993f966c3", main = true },
  { path = "zx0bench.h" },
  { path = "zx0blob.h" },
]
# Read the input from the embedded blob and write the output to a RAM
# buffer instead of files; leave out the upstream main ().  decompress ()
# is unchanged.  SDCC has no FILE, so the FILE globals go.
edit = [
  { file = "dzx0.c", old = "#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n", new = "#include \"zx0bench.h\"\n" },
  { file = "dzx0.c", old = "#define BUFFER_SIZE 65536", new = "#define BUFFER_SIZE ZX0_BUFFER_SIZE" },
  { file = "dzx0.c", old = "FILE *ifp;\nFILE *ofp;\n", new = "" },
  { file = "dzx0.c", old = "partial_counter = fread(input_data, sizeof(char), BUFFER_SIZE, ifp);", new = "partial_counter = input_size ? 0 : sizeof(zx0_blob);" },
  { file = "dzx0.c", old = "if (fwrite(output_data, sizeof(char), output_index, ofp) != output_index) {", new = "if (zx0_sink(output_data, output_index) != output_index) {" },
  { file = "dzx0.c", old = "input_data = (unsigned char *)malloc(BUFFER_SIZE);", new = "input_data = (unsigned char *)zx0_blob;" },
  { file = "dzx0.c", old = "output_data = (unsigned char *)malloc(BUFFER_SIZE);", new = "output_data = zx0_out;" },
  { file = "dzx0.c", old = "int main(int argc, char *argv[]) {", new = "#if 0 /* the upstream main () reads and writes files */\nint main(int argc, char *argv[]) {" },
  { file = "dzx0.c", old = "    return 0;\n}\n", new = "    return 0;\n}\n#endif\n" },
]

