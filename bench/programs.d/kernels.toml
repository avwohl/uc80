# Tier 2: real-world kernels.
#
# - zx0, lz4: decompressors on an embedded blob, output checked by CRC.
# - embench-*: Embench-IoT members that fit in 64 KB with a 16-bit int.
#   Each one prints PASS or FAIL from its own verify_benchmark ().
#   LOCAL_SCALE_FACTOR is lowered so that one run is a few million to a
#   few hundred million T-states.  Edits that port 32-bit-int code apply
#   to every compiler (they are portable C).  bench/programs/embench/
#   holds our support.h (stand-in for the upstream one) and embmain.h
#   (main ()); each embench-* directory has a main.c that includes
#   embmain.h, and lists the shared files as ../embench/<file>.
# - snd-*: sound-driver-shaped kernels (our own code), as CP/M programs.

[repo.embench]
commit = "09c2ed8c3b7008c95d08b038de4a3f6dc103ed70"
raw = "https://raw.githubusercontent.com/embench/embench-iot/{commit}/{path}"
license = "GPL-3.0-or-later, except md5.c and tarfind.c: MIT (SPDX headers in each file)"

[repo.zx0]
commit = "ecde3a2ae05061fe06469ed46df81a33b7de7d86"
raw = "https://raw.githubusercontent.com/einar-saukas/ZX0/{commit}/{path}"
license = "BSD-3-Clause (repository LICENSE; dzx0.c has no license header)"

