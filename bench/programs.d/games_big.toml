# Tier 3, the big "does it fit" group: real programs that are built for
# size only (kind = "size-only", no run).  Generated by
# bench/programs/games_big/gen_toml.py: do not edit by hand.
#
# Upstream files are fetched at a pinned commit and checked by sha256.
# Nothing from these projects is stored in this repository.  The "edit"
# entries (every compiler gets the same text) replace the system includes
# with bench/programs/games_big/bgstub.h (and the Rogue and mojozork
# equivalents), and fix what a C23 compiler rejects.
#
# Licenses: NetBSD games BSD-3-clause (Regents of the University of
# California); Rogue 3.6 BSD-3-clause; mojozork zlib.  uc80 itself is
# GPL-3.0-or-later; the glue files are ours.

[repo.netbsd]
commit = "5b0e0d5997518246c017c6577adcb59be12d0a79"
raw = "https://raw.githubusercontent.com/NetBSD/src/{commit}/{path}"
license = "BSD-3-clause (Regents of the University of California); per file"

[repo.rogue36]
commit = "f36912c4744b83ca79f9f5489a0528a2f0683996"
raw = "https://raw.githubusercontent.com/RoguelikeRestorationProject/rogue3.6/{commit}/{path}"
license = "BSD-3-clause (Toy, Arnold, Wichman); LICENSE.TXT"

[repo.mojozork]
commit = "ff7e00742a00acec8e175ddefb97520fb270df2d"
raw = "https://raw.githubusercontent.com/icculus/mojozork/{commit}/{path}"
license = "zlib"

