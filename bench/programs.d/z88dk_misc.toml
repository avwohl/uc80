# z88dk support/benchmarks: library qsort and other misc programs.
# Upstream z88dk files: see [repo.z88dk] in programs.toml (commit 94be67e8).
#
# sorting/sort.c: no license header in the file; z88dk is the Clarified
# Artistic License.  g_rand() in the file is from the SDCC library (GPLv2
# per its comment).  Fetched, not vendored.
#
# The test cases are separate programs, not variants, because each case
# prints different numbers, and a variant shares the golden file of its base.
#
# The one edit masks t << 9 to 32 bits in g_rand().  The host cc that makes
# the golden file has a 64-bit unsigned long, so without the mask the
# host sequence differs from the 32-bit sequence.  On every Z80 compiler
# the mask has no effect on the result, and g_rand() runs outside the timed
# region (only the qsort() call is timed).
#
# The second edit makes perform_sort() static.  clang (llvm-z80) inlines
# perform_sort() into main() and also keeps the external copy, so the
# TIMER_START/TIMER_STOP labels inside it appear twice and sdasz80 fails.
# The work does not change.

[[program]]
name = "sort-ran-20"
tier = 1
about = "library qsort() of 20 ints, random order (z88dk sorting; license: Clarified Artistic, unverified for this file)"
files = [{ repo = "z88dk", path = "support/benchmarks/sorting/sort.c", sha256 = "9ceba00f01046abdb1cc66d98b080481790de5e884a92da24b0106697b65a48f", main = true }]
check_defines = ["PRINTF", "NUM=20", "STYLE=0"]
time_defines = ["TIMER", "NUM=20", "STYLE=0"]
edit = [
  { file = "sort.c", old = "t ^= t << 9;", new = "t ^= (t << 9) & 0xffffffffUL;" },
  { file = "sort.c", old = "\nvoid perform_sort(void)", new = "\nstatic void perform_sort(void)" },
]

