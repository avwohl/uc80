# Tier 3, stdio game group: early Unix and classic BASIC-era games that
# talk to a terminal through stdin and stdout only (see
# docs/benchmark_proposal.md, 4.3, and docs/bench_harness.md, "Games").
#
# Every game gets a scripted input file (bench/programs/<name>/input.txt)
# that plays a real game to its end, and a golden file from a host build
# with the same shared glue (bench/support/posix_shim.[ch]).  Third-party
# sources are fetched at a pinned commit and checked by sha256; nothing
# of them is vendored.  The "edit" entries are applied for every
# compiler: they remove Unix headers, replace K&R definitions (uc80
# rejects them), and bind the game to the shim.
#
# Licenses:
#   FUZIX Applications/V7/games   Caldera International license (V7, 1979),
#                                 4-clause BSD style with an advertising
#                                 clause: see Applications/V7/COPYRIGHT
#   NetBSD games                  3-clause BSD (Regents of the University
#                                 of California), per file header
#   z88dk examples/console        per file; see each "about" line
#   FUZIX Applications/games      per file header


[repo.stdio-fuzix]
commit = "776bfc942c0ce3f5b86e4c48848d154a60ff1cb6"
raw = "https://raw.githubusercontent.com/EtchedPixels/FUZIX/{commit}/{path}"
license = "Caldera license for Applications/V7/games; per file header elsewhere"

[repo.stdio-netbsd]
commit = "5b0e0d5997518246c017c6577adcb59be12d0a79"
raw = "https://raw.githubusercontent.com/NetBSD/src/{commit}/games/{path}"
license = "3-clause BSD (Regents of the University of California), per file header"

[[program]]
name = "v7-arithmetic"
tier = 3
timing = "total"
about = "V7 arithmetic (Unix Version 7, 1979, FUZIX ANSI port; Caldera license): scripted quiz of 40 sums"
files = [
  { repo = "stdio-fuzix", path = "Applications/V7/games/arithmetic.c", sha256 = "e98d288862187a31f65702f73259657ae21134709608cde77c0577b96cc8bb6f", main = true },
  { shared = "support/posix_shim.c" },
  { shared = "support/posix_shim.h" },
  { shared = "stdio-glue/sglue.c" },
  { shared = "stdio-glue/sglue.h" },
]
edit = [
  { file = "arithmetic.c", old = "#include <unistd.h>\n", new = "#include <time.h>\n" },
  { file = "arithmetic.c", old = "#include <signal.h>\n", new = "#include \"posix_shim.h\"\n#include \"sglue.h\"\n#undef random\n#define random a_rand\n#define getline a_getl\n" },
  { file = "arithmetic.c", old = "void getline(char *s)\n{\n\tregister char *rs;\n\n\trs = s;\n\n\tfflush(stdout);\n\twhile ((*rs = getchar()) == ' ');\n\twhile (*rs != '\\n')\n\t\tif (*rs == 0)\n\t\t\texit(0);\n\t\telse if (rs >= &s[99]) {\n\t\t\twhile ((*rs = getchar()) != '\\n')\n\t\t\t\tif (*rs == '\\0')\n\t\t\t\t\texit(0);\n\t\t} else\n\t\t\t*++rs = getchar();\n\twhile (*--rs == ' ')\n\t\t*rs = '\\n';\n}\n", new = "void getline(char *s)\n{\n\tint c, n = 0;\n\n\tfflush(stdout);\n\tfor (;;) {\n\t\tc = getchar();\n\t\tif (c == EOF || c == 26 || c == 255 || c == 0)\n\t\t\texit(0);\n\t\tif (c == '\\r')\n\t\t\tcontinue;\n\t\tif (c == '\\n')\n\t\t\tbreak;\n\t\tif (c == ' ' && n == 0)\n\t\t\tcontinue;\n\t\tif (n < 99)\n\t\t\ts[n++] = c;\n\t}\n\twhile (n > 0 && s[n - 1] == ' ')\n\t\tn--;\n\ts[n] = '\\n';\n\ts[n + 1] = 0;\n}\n" },
  { file = "arithmetic.c", old = "\tsignal(SIGINT, delete);\n", new = "\tbench_args(&argc, &argv);\n\tsignal(SIGINT, delete);\n" },
  { file = "arithmetic.c", old = "k = stvec;", new = "k = (int)(stvec & 0x7fff);" },
  { file = "arithmetic.c", old = "temp = random(range) + random(range);", new = "temp = random(range);\n\ttemp += random(range);" },
  { file = "arithmetic.c", old = "l, l / rights, ((l * 100) / rights)%100);", new = "l, (int)(l / rights), (int)(((l * 100) / rights)%100));" },
]
stdin_file = "input.txt"
timeout = 600

