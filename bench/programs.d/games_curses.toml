# Tier 3: the curses games (see docs/benchmark_proposal.md, 4.3).
#
# The include edits (one for each #include line of each fetched file) were
# made by a script; edit this file by hand from now on.  The edits below are
# applied for every compiler and for the host golden build.  Nothing from NetBSD is stored in this repository: the files are
# fetched at the pinned commit and checked with sha256.
#
# License of the fetched files: 3-clause BSD (Regents of the University
# of California), per file header.  uc80 itself is GPL-3.0-or-later; the
# glue files (bench/support/*, bench/programs/games-curses/*) and the
# scripted inputs are ours.
#
# All games run on bench/support/tinycurses and bench/support/posix_shim
# (the same C for every compiler).  Each file that includes
# <sys/cdefs.h> gets bench/programs/games-curses/bsdcompat.h instead, and
# the BSD-only headers are dropped.  Score files, log files, command-line
# options and signals are cut by the edits (a program without the score
# file does what the original does when it cannot open the file).  The
# scripted keys play a deterministic game; the host golden build runs the
# same C with the same keys.  timing = "total": cycles are the whole run.

[repo.netbsd-curses]
commit = "5b0e0d5997518246c017c6577adcb59be12d0a79"
raw = "https://raw.githubusercontent.com/NetBSD/src/{commit}/{path}"
license = "3-clause BSD (Regents of the University of California), per file header"

[repo.fuzix-curses]
commit = "776bfc942c0ce3f5b86e4c48848d154a60ff1cb6"
raw = "https://raw.githubusercontent.com/EtchedPixels/FUZIX/{commit}/{path}"
license = "GPL-2.0-or-later (invaders.c: ascii invaders, 2001 Thomas Munro, in FUZIX Applications/cursesgames)"


