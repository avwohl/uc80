# Published integer benchmark sets (bench/programs.d/published_int.toml).
#
# 1. The Stanford integer benchmarks (Hennessy), as kept in the LLVM
#    test-suite, SingleSource/Benchmarks/Stanford.  License: the test-suite
#    LICENSE.TXT, Apache-2.0 WITH LLVM-exception plus the legacy NCSA
#    license (the Stanford files are not in its third-party list).
#    The files assume 32-bit int.  The edits below are the 16-bit port; they
#    apply to every compiler:
#    - every file declares the globals of all Stanford programs (~60 KB with
#      16-bit int, more than a CP/M TPA once the code is added).  Each
#      program drops the big arrays that it does not use.
#    - Rand() returns 0..65535, so it returns unsigned int.
#    - the sort values are -50000..15535, so sortlist is long.
#    - Treesort: free each tree after the check (the original leaks 100
#      trees), and 2000 instead of 5000 elements so that one tree fits.  The
#      printed values are sortlist[2..101], so the output does not change.
#    - Perm prints the unsigned pctr with %u.
#    - "#define Rand Rnd16" (Intmm, Quicksort, Bubblesort, Treesort) and
#      "#define Remove Unfit" (Puzzle): dcc 3.6.0 links with 6 monocase
#      characters (L80), so Rand and Remove clash with the libc rand and
#      remove and the dcc link fails.  The macro renames the function for
#      every compiler.  (It also hides a uc80 bug: uc80 calls the libc
#      function when a user function differs from it only in case.)
#    - the timer labels are in two small functions (bench_timer_start,
#      bench_timer_stop) defined before the macros: the files define a
#      macro d (Puzzle), and z88dk's intrinsic_label() macro expands to
#      __preserves_regs(a,b,c,d,e,h,l).  ("#undef d" before main() is not
#      used, because dcc 3.6.0 applies an #undef to earlier lines.)
#    - fewer passes of the LLVM main() loop (the LLVM files repeat each
#      program 100 times, Intmm 10 times; the original Stanford suite ran
#      each program once).  At 100 passes Puzzle takes 21.7G T-states and
#      Quicksort 8.0G even with SDCC, so each pass count below keeps a uc80
#      run under about 2G T-states.  The work per pass does not change.
#    - the golden files equal the first lines of the LLVM .reference_output
#      files (one line per pass; the "exit 0" line removed).
#    FloatMM, RealMM and Oscar (float) are not included.
#
# 2. davidly's CP/M benchmark programs.  E, SIEVE, TTT and MM come from
#    davidly/cpm_compilers (CC0-1.0): E.C, SIEVE.C and TTT.C from the
#    HI-TECH C 3.09 directory, MM.C from BDS C 1.60 (the only MM.C).  The
#    K&R function definitions in TTT.C and MM.C become prototype
#    definitions (C23 has no K&R definitions).  TM and TPI come from
#    davidly/dcc tests/ (MIT): the cpm_compilers TM.C is K&R and calls
#    calloc without <stdlib.h>, and the only TPI.C there uses unsigned
#    instead of long, so its digits are wrong.  Other edits, for every
#    compiler:
#    - TM: 50 blocks instead of 66 (see the comment in the edit; under
#      z88dk-ticks the stack starts at 0C9FEh, so 66 blocks do not fit), and
#      C89 declarations instead of "for (size_t i = ...", for HI-TECH C.
#    - TPI: "%.4d" with a long value becomes "%04ld" (same text for
#      0..9999; uc80, SDCC 4.6 and the z88dk classic printf ignore the
#      precision, see z88dk_int.toml).
#    - MM: the timer label functions, as in Stanford (MM defines a macro l),
#      and the sum is printed with %ld.%06ld instead of %f (SDCC's printf
#      has no float conversions; same text for the exact sum 465880).
#    - TTT: "typedef ttype pfunc_t();" + "pfunc_t *" becomes a pointer
#      typedef (same meaning; dcc 3.6.0 rejects a function typedef), and
#      the argument parse (never run: no argument) uses atoi, not sscanf
#      (SDCC and the llvm-z80 library have no sscanf).
#    - TPI: fflush(stdout) after each digit group removed (SDCC has no
#      fflush; output is the same).
#    - TM: "void exit(int status);" for SDCC only, whose stdlib.h does not
#      declare exit() (as in z88dk_int.toml, binary-trees).
#    - TM: logging = 0 instead of ( argc > 1 ).  The bench passes no
#      arguments, but the standalone SDCC and llvm-z80 start-up code calls
#      main() with argc undefined, which turned logging (printf in the
#      timed loop) on for those two compilers only.
#    Iteration counts are the upstream ones.
#    Each cpm_compilers file has its own [repo] entry, because the upstream
#    names are upper case (E.C) and contain spaces; the "raw" URL names the
#    file and "path" gives the local name.
#
# Treesort and TM call malloc.  z88dk classic needs a heap for malloc (the
# link fails with "_heap" undefined), so these two files get the
# "#pragma output CRT_HEAP_AMALLOC = 1" that the z88dk readmes pass, inside
# "#ifdef __Z88DK".  The standalone SDCC build uses the 1023-byte heap of
# SDCC's heap.s, which is too small for both programs.
#
# The timed region is marked with intrinsic_label(TIMER_START/STOP).  In
# the TIMER build each per-iteration printf becomes a store to the volatile
# bench_sink, so printing is outside the timed work.

[repo.llvm-test-suite]
commit = "b93f949ca6c38da7cf2eea708b5a86a4a5c9f30b"
raw = "https://raw.githubusercontent.com/llvm/llvm-test-suite/{commit}/{path}"
license = "Apache-2.0 WITH LLVM-exception, plus legacy NCSA"

[repo.dcc]
