[build-system]
# um80 supplies the um80/ulib80 console scripts that _uc80_build.py uses to
# assemble libc.lib, runtime.lib and crt0.rel into the wheel. Without it a
# published wheel ships a compiler with nothing to link against.
requires = ["setuptools>=64.0", "wheel", "um80>=0.3.46"]
build-backend = "_uc80_build"
backend-path = ["."]

[project]
name = "uc80"
version = "0.7.0"
description = "ANSI C compiler targeting Z80/CP/M"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "upeepz80>=0.2.3",
    "uc_core>=0.4.1",
    "uplox>=3.3.0",
]
authors = [
    {name = "uc80 developers"}
]
keywords = [
    "compiler", "c", "z80", "cp/m", "retro-computing",
    "cross-compiler", "8-bit", "ansi-c"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Emulators",
]

[project.urls]
Homepage = "https://github.com/avwohl/uc80"
Repository = "https://github.com/avwohl/uc80"
Issues = "https://github.com/avwohl/uc80/issues"

[project.scripts]
uc80 = "uc80.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# No "py.typed": uc80 ships inline annotations but has never been type
# checked (mypy reports 74 errors across codegen/asm_dce/runtime, including
# arg-type and attr-defined), there is no type checker in the dev extra or
# in CI, and PEP 561 is a support promise. The entry was declared here for a
# file that does not exist; dropping the claim is what matches reality.
#
# The library globs are deliberately narrow. build_libs.py also produces
# libc.rel, runtime.rel and ~92 per-module lc/*.rel and rt/*.rel that
# nothing links against; a "lib/**/*.rel" glob would put ~105 KB of them in
# every wheel. Only these three are link inputs.
uc80 = [
    "lib/**/*.mac",
    "lib/**/*.h",
    "lib/*.lib",
    "lib/crt0.rel",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
